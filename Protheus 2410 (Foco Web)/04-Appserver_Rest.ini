;==================================================================
;==================  Configuracoes do Environment PRODUCAO ========
;==================================================================
[PROTHEUS]
SourcePath=D:\TOTVS\Protheus\protheus\apos\apo_principal
RpoCustom=D:\TOTVS\Protheus\protheus\apos\apo_principal\custom.rpo
RootPath=D:\TOTVS\Protheus\protheus_data
StartPath=\system\
x2_path=
RpoDb=top
RpoLanguage=multi
RpoVersion=120
LocalFiles=CTREE
Trace=0
localdbextension=.dtc
StartSysInDB=1
topmemomega=50
DBDataBase=POSTGRES
DBAlias=protheusPG
DBServer=localhost
DBPort=7890
DbODBCDriver=PostgreSQL ODBC Driver(ANSI)
DbDNSServer=localhost

;==================================================================
;=======  Configuracoes do Rede e Autenticacao do Serviço =========
;==================================================================
[Drivers]
Active=TCP

[TCP]
TYPE=TCPIP
Port=4060

;==================================================================
;===============  Configuracoes Gerais do Serviço =================
;==================================================================
[General]
CONSOLE=1
CONSOLELOG=1
LogHttpFuncs=1
tlpp_rest_log=1
Maxquerysize=31960
;inactiveTimeout=3600

;==================================================================
;====================  Configuracoes do Serviço ===================
;=================================================================
[Service]
Name=06.00-TOTVS-Appserver12
DisplayName=06.00 - TOTVS | Appserver 12 - Rest

[LICENSECLIENT]
server=localhost
port=5555

;==================================================================
;===============  Configuracoes do Web App exclusivo ==============
;==================================================================
[WebApp/webapp]
MPP=

;==================================================================
;====================  Configuracoes do REST ======================
;==================================================================
[HTTP] 
ENABLE=1 
PORT=9905
PATH=D:\TOTVS\Protheus\protheus_data\http-root

[HTTPV11]
SOCKETS=HTTPREST
ENABLE=1
 
[HTTPREST]
Port=9902
IPSBIND=
URIs=HTTPURI
Security=1
 
[HTTPURI]
URL=/rest
PrepareIn=all
Instances=1,1
CORSEnable=1
AllowOrigin=*
 
[HTTPJOB]
MAIN=HTTP_START
ENVIRONMENT=PROTHEUS
  
[OnStart]
JOBS=HTTPJOB
;JOBS=HTTPJOB,TAF_CFGJOB
RefreshRate=120
